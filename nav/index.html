<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="refresh" content="3;url=main.html">
  <title>AgriMart</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f5f0; /* light background */
      overflow: hidden;
    }

    h1 {
      font-size: 4rem;
      font-family: 'Arial', sans-serif;
      color: #2e8b57;
      opacity: 0;
      transform: scale(0.5);
      animation: nani 2s ease forwards;
      background-color: aliceblue;

    }

    @keyframes nani{
      0% {
        opacity: 0;
        transform: scale(0.5);
        text-decoration: underline;
        
        /* background-color: rgb(72, 108, 141); */
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
        /* background-color: yellowgreen; */
      }
      100% {
        opacity: 1;
        transform: scale(1);
        text-decoration: underline;
      
      }
    }
  </style>
</head>
<body>
  <h1>AGRIMART</h1>
  
</body>
</html>
